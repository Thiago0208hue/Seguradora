#{extends 'main.html' /}
#{set title:'Cadastro de Apólice' /}

#{if s?.id}
	<h1 class="mt-3"><i class="bi bi-pencil-square"></i> Edição de Apólice</h1>
#{/if}
#{else}
	<h1 class="mt-3"><i class="bi bi-file-earmark-plus"></i> Cadastro de Apólice</h1>
#{/else}

<hr />

<form action="/seguros/salvar" method="post" class="col-md-6">

	<input type="hidden" name="seguro.id" value="${s.id}" />

	<div class="mb-3">
		<label class="form-label"><i class="bi bi-car-front"></i> Placa do veículo</label>
		<input type="text" name="seguro.placa" value="${s.placa}" class="form-control" placeholder="Placa do veículo" />
	</div>

	<div class="mb-3">
		<label class="form-label"><i class="bi bi-car-front-fill"></i> Modelo do veículo</label>
		<input type="text" name="seguro.modelo" value="${s.modelo}" class="form-control" placeholder="Modelo do veículo" />
	</div>

	<div class="mb-3">
		<label class="form-label"><i class="bi bi-calendar-event"></i> Data de contratação</label>
		<input type="text" name="seguro.dataContratacao" value="${s.dataContratacao}" class="form-control" placeholder="dd/MM/yyyy" />
	</div>

	<div class="mb-3">
		<label class="form-label"><i class="bi bi-person-badge"></i> Segurado</label>
		<select name="seguro.segurado.id" class="form-select">
			<option value="">Selecione o segurado...</option>
			#{list items:segurados, as:'seg'}
				<option value="${seg.id}" ${seg.id == s.segurado?.id ? 'selected' : ''}>
					${seg.nome}
				</option>
			#{/list}
		</select>
	</div>

	<button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
	<a href="@{Seguros.listar}" class="btn btn-outline-secondary">Cancelar</a>
</form>

<hr />
<a href="@{Segurados.form}" class="btn btn-sm btn-outline-primary"><i class="bi bi-plus-circle"></i> Cadastrar novo segurado</a>
