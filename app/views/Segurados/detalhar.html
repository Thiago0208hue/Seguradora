#{extends 'main.html' /}
#{set title:'Detalhamento de Segurado' /}

<div class="d-flex justify-content-between align-items-center mt-3 mb-3">
	<h1><i class="bi bi-people"></i> Detalhamento do Segurado</h1>
	<div>
		<a href="@{Segurados.editar(segurado.id)}" class="btn btn-secondary"><i class="bi bi-pencil"></i> Editar</a>
		<a href="@{Segurados.remover(segurado.id)}" class="btn btn-danger"><i class="bi bi-trash"></i> Remover</a>
	</div>
</div>
<hr />

<div class="card col-md-6 mb-3 shadow-sm">
	<div class="card-header bg-primary text-white">
		<strong><i class="bi bi-hash"></i> Segurado #${segurado.id}</strong>
	</div>
	<ul class="list-group list-group-flush">
		<li class="list-group-item d-flex justify-content-between">
			<span class="text-muted"><i class="bi bi-person"></i> Nome</span>
			<span>${segurado.nome}</span>
		</li>
		<li class="list-group-item d-flex justify-content-between">
			<span class="text-muted"><i class="bi bi-card-text"></i> CPF</span>
			<span>${segurado.cpf}</span>
		</li>
		<li class="list-group-item d-flex justify-content-between">
			<span class="text-muted"><i class="bi bi-envelope"></i> Email</span>
			<span>${segurado.email ?: 'Não informado'}</span>
		</li>
		<li class="list-group-item d-flex justify-content-between">
			<span class="text-muted"><i class="bi bi-telephone"></i> Telefone</span>
			<span>${segurado.telefone ?: 'Não informado'}</span>
		</li>
	</ul>
</div>

<a href="@{Segurados.listar}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Retornar</a>
