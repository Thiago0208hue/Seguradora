
#{extends 'main.html' /}
#{set title:'Registrar' /}

<h1 class="mt-3">
    <i class="bi bi-person-plus"></i> Registrar
</h1>

<hr />

#{if flash.error}
    <div class="alert alert-danger">
        ${flash.error}
    </div>
#{/if}

<form action="@{Logado.criar()}" method="post" class="col-md-4">

    <div class="mb-3">
        <label class="form-label">Nome completo</label>
        <input
            type="text"
            name="nome"
            class="form-control"
            maxlength="100"
            required
        />
    </div>

    <div class="mb-3">
        <label class="form-label">Login</label>
        <input
            type="text"
            name="login"
            class="form-control"
            maxlength="50"
            required
        />
    </div>

    <div class="mb-3">
        <label class="form-label">Senha</label>
        <input
            type="password"
            name="senha"
            class="form-control"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
        />
    </div>

    <button type="submit" class="btn btn-primary">
        Registrar
    </button>

    <a href="@{Logado.form()}" class="btn btn-link">
        Voltar ao login
    </a>

</form>
